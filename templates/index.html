<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppa Pig Scan</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="site-head">
      <h1>im peppa pig bam bam bamamam</h1>
      <p class="tag">i'm gonna jump in {{ total }} muddy puddles hahahahaha.</p>
    </header>

    <section class="card controls">
      <label for="choice">Compression check:</label>
      <select id="choice">
        <option value="a">a — Range tightening</option>
        <option value="b">b — Coefficient of variation</option>
      </select>
      <button id="run-btn">Run Scan</button>
    </section>

    <!-- live progress -->
    <section id="progress-card" class="card hidden">
      <div class="progress-top">
        <span id="progress-label">Warming up…</span>
        <span id="match-count" class="match-count">0 matches</span>
      </div>
      <div class="bar-track">
        <div id="bar-fill" class="bar-fill"></div>
      </div>
      <div id="progress-note" class="note"></div>
    </section>

    <!-- results -->
    <section id="results-card" class="card hidden">
      <h2 id="results-title">Results</h2>
      <div class="table-scroll">
        <table id="results-table">
          <thead><tr id="results-head"></tr></thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
      <p class="hint">Click any ticker to see its chart & full breakdown.</p>
    </section>

    <div id="empty-msg" class="card hidden empty"></div>

    <footer class="site-foot">made by anusha sawhneyyyy</footer>
  </div>

  <script>
    // total tickers, injected so the tagline + bar are accurate
    window.TOTAL_TICKERS = {{ total }};
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
